name: TARA Security Analysis

on:
  push:
    branches: [ main, open-cv, development ]
  pull_request:
    branches: [ main ]

jobs:
  tara-analysis:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Install Cppcheck
        run: |
          choco install cppcheck

      - name: Run static analysis
        run: |
          mkdir reports
          cppcheck --enable=warning,style,performance,portability,information --inconclusive --language=c --std=c99 --platform=win64 --suppress=missingIncludeSystem --xml --xml-version=2 -I car_poc/inc -I car_poc/cfg car_poc/src/app_autobrake.c car_poc/src/app_speedgov.c car_poc/src/app_wipers.c car_poc/src/app_autopark.c car_poc/src/app_climate.c 2> reports/cppcheck.xml

      - name: Run TARA analysis
        run: |
          python scripts/tara_check.py

      - name: Upload TARA results
        uses: actions/upload-artifact@v4
        with:
          name: tara-security-analysis
          path: |
            tara_check_results.csv
            reports/cppcheck.xml
        if: always()

      - name: Comment PR with TARA results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'tara_check_results.csv';

            if (fs.existsSync(path)) {
              const content = fs.readFileSync(path, 'utf8');
              const lines = content.split('\n');

              // Extract summary information
              const summaryLines = lines.filter(line => line.startsWith('summary,'));
              const verdict = lines.find(line => line.includes('verdict'));

              let comment = '## TARA Security Analysis Results\n\n';

              if (verdict) {
                const parts = verdict.split(',');
                const status = parts[3];
                const details = parts[4];

                if (status === 'PASS') {
                  comment += '✅ **PASS** - All security checks passed\n\n';
                } else {
                  comment += '❌ **FAIL** - Security issues found\n\n';
                }
                comment += `**Details:** ${details}\n\n`;
              }

              // Add summary stats
              comment += '### Summary\n';
              summaryLines.forEach(line => {
                const parts = line.split(',');
                if (parts.length >= 4) {
                  comment += `- **${parts[1]}**: ${parts[3]}\n`;
                }
              });

              comment += '\n📊 Full results available in the workflow artifacts.';

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

      - name: Fail on security issues
        run: |
          python -c "
          import csv
          with open('tara_check_results.csv', 'r') as f:
              reader = csv.reader(f)
              for row in reader:
                  if len(row) >= 4 and row[2] == 'verdict' and row[3] == 'FAIL':
                      print('❌ TARA analysis failed - security issues detected')
                      exit(1)
          print('✅ TARA analysis passed')
          "